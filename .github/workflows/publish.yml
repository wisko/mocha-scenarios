name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# A re-pushed tag replaces a run of the same tag that is still going.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rejects a bad tag before anything reaches npm.
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The ancestor check needs the history of main.
          fetch-depth: 0

      - name: Tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Tagged commit is on main
        run: git merge-base --is-ancestor HEAD origin/main

      - name: CHANGELOG.md has the section
        run: node scripts/changelog-section.js

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/mocha-scenarios/v/${{ needs.verify.outputs.version }}
    permissions:
      # id-token lets npm verify the run through OIDC (trusted publishing); contents lets
      # `gh release create` write the Release.
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      # `npm stage publish` needs npm >= 11.15; the npm bundled with Node may be older.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      # `prepublishOnly` runs the full test suite first. The version is staged, not published: it
      # goes live once a maintainer approves it on npmjs.com with 2FA. Provenance is generated
      # automatically with trusted publishing. Prereleases go under the `next` dist-tag.
      - name: Stage on npm
        run: npm stage publish --tag "${{ needs.verify.outputs.prerelease == 'true' && 'next' || 'latest' }}"

      # Created right after staging, so the Release exists while the version awaits approval.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          node scripts/changelog-section.js > release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md \
            $([ "$PRERELEASE" = true ] && echo --prerelease)
