name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 20 resolves to 20.19.x, the require(esm) floor in `engines`. The other floor, 22.12, cannot be
        # tested: ESLint 10 requires ^22.13.0 on that line, so `npm ci` fails under engine-strict.
        node: [20, 22, 24, 26]
        mocha: ['11', '12']
        include:
          # Tests the lockfile's mocha as is, so a Dependabot bump to a new major is run.
          - node: 26
            mocha: lockfile
    name: Node ${{ matrix.node }} / mocha ${{ matrix.mocha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Install specific mocha version
        if: matrix.mocha != 'lockfile'
        run: npm install --no-save mocha@${{ matrix.mocha }}

      - name: Test
        run: npm test

  # The ruleset on `main` requires this single check
  summary:
    name: Test matrix
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        if: needs.test.result != 'success'
        run: exit 1
