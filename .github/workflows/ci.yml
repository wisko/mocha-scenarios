name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 20 resolves to 20.19.x, the require(esm) floor in `engines`. The other floor, 22.12, cannot be
        # tested: ESLint 10 requires ^22.13.0 on that line, so `npm ci` fails under engine-strict.
        node: [20, 22, 24, 26]
        mocha: ['11', '12']
    name: Node ${{ matrix.node }} / mocha ${{ matrix.mocha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Install specific mocha version
        run: npm install --no-save mocha@${{ matrix.mocha }}

      - name: Test
        run: npm test
