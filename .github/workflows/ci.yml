name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        mocha: ['11', '12']
    name: Test mocha ${{ matrix.mocha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install specific mocha version
        run: npm install --no-save mocha@${{ matrix.mocha }}

      - name: Test
        run: npm test
