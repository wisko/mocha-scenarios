name: Feature request
description: Propose a change to the vocabulary, the hooks or the reporter output
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How a feature file using the change would look.
      render: js
